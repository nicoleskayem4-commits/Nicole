<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Décimaux – 6e</title><style>
:root{font-family:system-ui,'Segoe UI',sans-serif;color:#18304a;background:#eef5fb}*{box-sizing:border-box}body{margin:0}header{background:#15385f;color:white;padding:18px 3vw;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:clamp(23px,3vw,37px);margin:0}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:750;background:#dfeafa;color:#173b65}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible{outline:4px solid #f3b43b}button.primary{background:#1465c0;color:white}button.good{background:#117653;color:white}.wrap{max-width:1300px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:17px}nav button.active{background:#15385f;color:white}.panel{background:white;border-radius:20px;padding:24px;box-shadow:0 6px 25px #1d456017}.title{font-size:clamp(25px,3vw,37px);margin:0 0 8px}.sub{font-size:19px;color:#4c647b;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.task{border:2px solid #dbe6f3;background:#f8fbff;border-radius:15px;padding:17px}.task h3{margin:0 0 10px;font-size:23px}.calc{font-size:clamp(25px,3vw,37px);font-weight:750;white-space:nowrap}.answer{width:145px;max-width:100%;font-size:25px;padding:9px;border:2px solid #9cb7d0;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.feedback{font-size:19px;font-weight:700;min-height:27px;margin-top:10px}.ok{color:#08794e}.no{color:#ad3b24}.hint{background:#fff5dc;border-left:5px solid #f4b63b;padding:12px 16px;border-radius:10px;font-size:18px;margin:12px 0}.numberline{margin:12px 0;background:white;border:2px solid #cbdff0;border-radius:16px;padding:12px}.numberline svg{width:100%;height:auto;display:block}.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:17px;font-weight:650}.legend span:before{content:'● ';}.legend .first{color:#1478d4}.legend .second{color:#e17a18}.legend .result{color:#148353}.decomp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:24px;font-weight:700}.decomp input{width:76px;text-align:center;font-size:24px;padding:7px;border:2px solid #adc7de;border-radius:9px}.place{display:flex;justify-content:center;overflow:auto}.digits{border-collapse:collapse;margin:12px auto;font-size:29px;text-align:center}.digits th{font-size:14px;padding:8px;color:#50647b}.digits td{width:47px;height:53px;border:1px solid #bed1e3;background:#fff}.digits .comma{width:20px;background:#e4f2ff;color:#0969bf;font-weight:900}.digits input{width:44px;height:49px;border:0;text-align:center;background:transparent;font-size:28px}.digits .line td{border-top:4px solid #243a53}.digits .operator{border:0;background:transparent;width:33px}.progress{font-weight:700;color:#42617c}.timer{font-size:34px;font-weight:850;color:#bb521d}.score{font-size:22px;font-weight:750}.hidden{display:none}.welcome{font-size:20px;line-height:1.6}.welcome li{margin:9px 0}@media(max-width:650px){.wrap{padding:9px}.panel{padding:13px}.task{padding:10px}header{display:block}.digits td{width:34px}.digits input{width:31px;font-size:22px}}
</style></head><body><header><h1>🚀 Mission Décimaux <small style="font-size:16px">6e</small></h1><span>Observer · Manipuler · Calculer · Vérifier</span></header><div class="wrap"><nav id="nav"></nav><main id="app" class="panel"></main></div><script>
const app=document.querySelector('#app'),nav=document.querySelector('#nav');let current='home',items=[],step=0,locked=false,showJump=false,course=[],idx=0,points=0,start=0,timer=null,seconds=120;const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>(Math.round(n*1000)/1000).toString().replace('.',','),num=s=>Number(String(s).replace(',','.')),pick=a=>a[rnd(0,a.length-1)];
const names=['Accueil','1 · Décimaux < 1','2 · Entier + décimal','3 · Décomposer','4 · Additions posées','5 · Soustraire mentalement','6 · Soustractions posées','🏁 Course'];function navDraw(){nav.innerHTML=names.map((x,i)=>`<button class="${current===(i===0?'home':i===7?'race':String(i))?'active':''}" data-n="${i}">${x}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>go(Number(b.dataset.n)))}
function gen(type){let a,b,c;if(type===1){a=rnd(1,9)/10;b=rnd(1,9)/10;return {a,b,op:'+',kind:type}}if(type===2){a=rnd(2,39);b=rnd(11,89)/10;return {a,b,op:'+',kind:type}}if(type===3){a=rnd(11,99)/10;b=rnd(11,99)/10;return {a,b,op:'+',kind:type}}if(type===4){let k=step%3;if(k===0){a=rnd(101,799)/100;b=rnd(101,899)/100;return {a,b,op:'+',kind:type}}if(k===1){a=rnd(101,899)/100;b=rnd(101,899)/100;c=rnd(1001,7999)/1000;return {a,b,c,op:'+',kind:type}}a=rnd(10,209);b=rnd(101,999)/100;return {a,b,op:'+',kind:type}}if(type===5){a=rnd(9,69);b=rnd(1,Math.min(89,a*10-1))/10;return {a,b,op:'-',kind:type}}if(type===6){if(step%2===0){a=rnd(1000,8900)/100;b=rnd(101,Math.floor(a*100)-1)/100}else{a=rnd(10,89);b=rnd(11,a*10-1)/10}return {a,b,op:'-',kind:type}}}
function total(o){return o.op==='+'?o.a+o.b+(o.c||0):o.a-o.b}function expression(o){return [fmt(o.a),o.op,fmt(o.b),...(o.c?['+',fmt(o.c)]:[])].join(' ')}function fresh(type){step=0;items=[];for(let i=0;i<(type===4?3:type===6?2:4);i++){step=i;items.push(gen(type))}step=0;locked=false;showJump=false}
function go(n){clearInterval(timer);current=n===0?'home':n===7?'race':String(n);navDraw();if(n===0)return home();if(n===7)return raceIntro();fresh(n);render()}
function home(){app.innerHTML=`<h2 class="title">Bienvenue dans la mission !</h2><p class="welcome">Les calculs reprennent <strong>les mêmes types de nombres et les mêmes consignes que ta fiche</strong>, avec de nouvelles valeurs à chaque entrée.</p><div class="grid"><div class="task"><h3>🔎 D'abord, je comprends</h3><p>Une droite graduée très lisible pour les deux premiers exercices ; une décomposition guidée pour le troisième.</p></div><div class="task"><h3>✍️ Ensuite, je calcule</h3><p>Des opérations posées en colonnes : les virgules doivent être alignées.</p></div><div class="task"><h3>🏁 Enfin, je me teste</h3><p>8 calculs mentaux inédits, sans opérations posées, en 2 minutes.</p></div></div><div class="actions"><button class="primary" onclick="go(1)">Commencer l'exercice 1 →</button></div>`}
function line(o){let a=o.a,b=o.b,end=a+b;let max=Math.max(2,Math.ceil(end*10)/10+.2),unit=max<=2?.1:max<=15?.5:2;let left=60,right=1060,w=right-left,xx=v=>left+w*v/max;let ticks='';for(let i=0;i<=Math.floor(max/unit+.00001);i++){let v=i*unit,x=xx(v),major=Math.abs(v-Math.round(v))<.0001;ticks+=`<line x1="${x}" y1="${major?145:151}" x2="${x}" y2="166" stroke="#294b68" stroke-width="${major?3:1.6}"/>`;if(major||max<=2)ticks+=`<text x="${x}" y="191" font-size="${max<=2?19:21}" text-anchor="middle" fill="#294b68">${fmt(v)}</text>`}let arc=(s,e,h,color,label)=>`<path d="M${xx(s)} 139 Q${(xx(s)+xx(e))/2} ${h} ${xx(e)} 139" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"/><path d="M${xx(e)-9} 129 L${xx(e)} 139 L${xx(e)-11} 146" fill="none" stroke="${color}" stroke-width="4"/><text x="${(xx(s)+xx(e))/2}" y="${h-8}" text-anchor="middle" font-size="25" font-weight="bold" fill="${color}">${label}</text>`;return `<div class="numberline"><svg viewBox="0 0 1120 210" role="img" aria-label="Droite graduée de zéro à ${fmt(max)}, avec deux sauts pour additionner"><line x1="${left}" y1="155" x2="${right+8}" y2="155" stroke="#294b68" stroke-width="4"/><path d="M${right} 147 L${right+12} 155 L${right} 163" fill="none" stroke="#294b68" stroke-width="3"/>${ticks}${showJump?arc(0,a,Math.max(18,120-(xx(a)-xx(0))/9),'#1478d4','+'+fmt(a))+arc(a,end,Math.max(8,113-(xx(end)-xx(a))/9),'#e17a18','+'+fmt(b))+`<circle cx="${xx(end)}" cy="155" r="8" fill="#148353"/><text x="${xx(end)}" y="209" font-size="24" font-weight="bold" text-anchor="middle" fill="#148353">${fmt(end)}</text>`:''}</svg><div class="legend"><span class="first">1er saut : ${fmt(a)}</span><span class="second">2e saut : ${fmt(b)}</span><span class="result">Arrivée : ${showJump?fmt(end):'à découvrir'}</span></div></div>`}
function exerciseHeader(type){let title={1:'1 – Calculer sans poser.',2:'2 – Calculer sans poser.',3:'3 – Calculer sans poser.',4:'4 – Poser et effectuer.',5:'5 – Calculer sans poser.',6:'6 – Poser et effectuer les différences suivantes.'};let subtitle={1:'Addition de deux nombres commençant par 0, comme 0,3 + 0,6.',2:'Addition d’un entier et d’un décimal, comme 5 + 7,4.',3:'Addition de deux nombres décimaux, comme 3,4 + 5,2 : décomposer avant de répondre.',4:'Aligne les virgules avant de calculer : 2 termes, 3 termes, puis un entier et un décimal.',5:'Soustraire un nombre décimal à un entier, comme 9 − 0,6.',6:'Aligne les virgules pour poser les soustractions.'};return `<h2 class="title">${title[type]}</h2><p class="sub">${subtitle[type]}</p><div class="progress">Calcul ${step+1} sur ${items.length}</div>`}
function render(){let type=Number(current),o=items[step];showJump=false;let body='';if(type<=2)body=`<div class="calc">${expression(o)} = ?</div><p>Observe les graduations. Fais d’abord le calcul, puis vérifie avec les deux sauts.</p>${line(o)}<button onclick="jump()">👀 Montrer les deux sauts</button>`;else if(type===3)body=`<div class="calc">${expression(o)} = ?</div><p>Complète la décomposition avant d'écrire la somme.</p><div class="hint">Sépare les parties entières et les parties décimales.</div>${decompFields(o)}<button style="margin-top:12px" onclick="checkDecomp()">Vérifier ma décomposition</button><div id="decompFeedback" class="feedback"></div>`;else if(type===4||type===6)body=`<div class="calc">${expression(o)} = ?</div><p>Pose les nombres dans le tableau : une case par chiffre, <strong>les virgules l'une sous l'autre</strong>.</p>${placeGrid(o)}<button onclick="checkPlacement()">Vérifier l'alignement</button><button onclick="checkGridResult()">Vérifier le résultat dans le quadrillage</button><div id="placeFeedback" class="feedback"></div>`;else body=`<div class="calc">${expression(o)} = ?</div><div class="hint">Cherche mentalement, puis écris le résultat.</div>`;app.innerHTML=exerciseHeader(type)+`<section class="task" style="margin-top:15px">${body}<div class="actions"><label style="font-size:22px;font-weight:700">Résultat : <input class="answer" id="answer" inputmode="decimal" autocomplete="off" aria-label="Résultat du calcul"></label><button class="primary" onclick="verify()">Vérifier le résultat</button></div><div id="feedback" class="feedback" aria-live="polite"></div></section><div class="actions"><button onclick="next()">${step===items.length-1?'Recommencer avec de nouveaux nombres':'Calcul suivant →'}</button><button onclick="fresh(${type});render()">🔄 Nouveaux nombres</button><button onclick="go(${type===6?7:type+1})" class="good">${type===6?'Passer à la course 🏁':'Exercice suivant →'}</button></div>`}
function jump(){showJump=true;let node=document.querySelector('.numberline');node.outerHTML=line(items[step])}function decompFields(o){let vals=[Math.floor(o.a),Math.floor(o.b),Math.round((o.a%1)*10)/10,Math.round((o.b%1)*10)/10];let labels=['Partie entière du premier nombre','Partie entière du deuxième nombre','Partie décimale du premier nombre','Partie décimale du deuxième nombre'];return '<div class="decomp">'+vals.map((v,i)=>v===0?'':`<input id="d${i+1}" inputmode="decimal" aria-label="${labels[i]}" placeholder="?">`).filter(Boolean).join(' + ')+'</div>'}
function checkDecomp(){let o=items[step],vals=[Math.floor(o.a),Math.floor(o.b),o.a-Math.floor(o.a),o.b-Math.floor(o.b)];let ok=vals.every((v,i)=>{if(Math.abs(v)<.0001)return true;let e=document.querySelector('#d'+(i+1));return e&&e.value.trim()!==''&&Math.abs(num(e.value)-v)<.0001});document.querySelector('#decompFeedback').innerHTML=ok?`<span class="ok">✓ Bravo ! Les unités et les dixièmes sont séparés. Tu peux calculer la somme.</span>`:`<span class="no">Réessaie : écris d'abord les deux parties entières, puis les deux parties décimales.</span>`}
function placeGrid(o){let nums=[o.a,o.b,...(o.c?[o.c]:[])],prec=Math.max(...nums.map(x=>fmt(x).split(',')[1]?.length||0)),width=3+prec;let heads=['Centaines','Dizaines','Unités','Virgule','Dixièmes','Centièmes','Millièmes'];let used=[...heads.slice(3-width+prec,3),'Virgule',...heads.slice(4,4+prec)];if(used.length!==width+1)used=heads.slice(0,3).slice(-3).concat(['Virgule'],heads.slice(4,4+prec));let rows=nums.map((v,r)=>`<tr><td class="operator">${r===0?'':o.op==='+'?'+':'−'}</td>${Array.from({length:3},(_,i)=>`<td><input maxlength="1" inputmode="numeric" data-r="${r}" data-p="${i-3}" aria-label="Ligne ${r+1}, position ${i}"></td>`).join('')}<td class="comma">,</td>${Array.from({length:prec},(_,i)=>`<td><input maxlength="1" inputmode="numeric" data-r="${r}" data-p="${i+1}" aria-label="Ligne ${r+1}, décimale ${i+1}"></td>`).join('')}</tr>`).join('');return `<div class="place"><table class="digits"><thead><tr><th></th>${['C','D','U',',','d','c','m'].slice(0,4+prec).map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody>${rows}<tr class="line"><td class="operator">=</td>${Array.from({length:4+prec},(_,i)=>i===3?'<td class="comma">,</td>':`<td><input maxlength="1" inputmode="numeric" data-result="${i<3?i-3:i-3}" aria-label="Chiffre du résultat, colonne ${i}"></td>`).join('')}</tr></tbody></table></div><div class="hint">Les cases vides peuvent rester vides. Place chaque chiffre dans sa colonne. La virgule est déjà indiquée.</div>`}
function checkPlacement(){let o=items[step],nums=[o.a,o.b,...(o.c?[o.c]:[])],ok=true;nums.forEach((v,r)=>{let [int,dec='']=fmt(v).split(',');let expected={};[...int].reverse().forEach((d,i)=>expected[-i-1]=d);[...dec].forEach((d,i)=>expected[i+1]=d);document.querySelectorAll(`[data-r="${r}"]`).forEach(el=>{if(el.value.trim()!==(expected[el.dataset.p]||''))ok=false})});document.querySelector('#placeFeedback').innerHTML=ok?'<span class="ok">✓ Les nombres sont bien alignés ! Calcule maintenant.</span>':'<span class="no">Vérifie : le chiffre des unités est juste à gauche de la virgule, les dixièmes juste à droite.</span>'}
function checkGridResult(){let o=items[step],t=fmt(Math.round(total(o)*1000)/1000),parts=t.split(','),whole=parts[0],frac=parts[1]||'';let good=true;document.querySelectorAll('[data-result]').forEach(el=>{let pos=Number(el.dataset.result),expected=pos<0?(whole[whole.length+pos]||''):(frac[pos-1]||'');if(el.value.trim()!==expected)good=false});document.querySelector('#placeFeedback').innerHTML=good?'<span class="ok">✓ Bravo ! Le résultat est bien écrit sous le trait, dans les bonnes colonnes.</span>':'<span class="no">Vérifie les chiffres du résultat sous le trait, en respectant chaque colonne.</span>'}
function verify(){let o=items[step],el=document.querySelector('#answer'),fb=document.querySelector('#feedback');if(!el.value.trim())return fb.innerHTML='<span class="no">Écris d’abord une réponse.</span>';let ok=Math.abs(num(el.value)-total(o))<.00001;fb.innerHTML=ok?'<span class="ok">✓ Bravo, résultat correct !</span>':`<span class="no">Pas encore. ${Number(current)<=2?'Utilise les sauts sur la droite graduée.':Number(current)===3?'Regroupe les unités, puis les dixièmes.':'Vérifie les rangs des chiffres et les retenues.'}</span>`;if(ok&&Number(current)<=2&&!showJump)jump()}
function next(){if(step===items.length-1){fresh(Number(current));render()}else{step++;render()}}
function raceIntro(){app.innerHTML=`<h2 class="title">🏁 La course aux nombres</h2><p class="welcome">8 calculs inédits : <strong>2 de chacun des 4 exercices de calcul mental (1, 2, 3 et 5)</strong>. Tu disposes de <strong>2 minutes</strong> pour répondre. Sans droite graduée ni aide : c'est le moment de vérifier tes acquis !</p><button class="primary" onclick="startRace()">🚦 Démarrer la course</button>`}
function startRace(){course=[];for(let t of [1,2,3,5])for(let j=0;j<2;j++){step=j;course.push(gen(t))}course=course.sort(()=>Math.random()-.5);idx=0;points=0;seconds=120;start=Date.now();raceRender();timer=setInterval(()=>{seconds=Math.max(0,120-Math.floor((Date.now()-start)/1000));let el=document.querySelector('#clock');if(el)el.textContent=clock();if(seconds<=0)finish()},250)}function clock(){return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}function raceRender(){let o=course[idx];app.innerHTML=`<h2 class="title">🏁 Course aux nombres</h2><div class="progress">Question ${idx+1} / ${course.length}</div><p class="timer" id="clock">${clock()}</p><section class="task"><div class="calc">${expression(o)} = ?</div><div class="actions"><input id="raceAnswer" class="answer" inputmode="decimal" autocomplete="off" aria-label="Réponse à la course"><button class="primary" onclick="raceCheck()">Valider →</button></div><div id="raceFeedback" class="feedback"></div></section><p class="score">Bonnes réponses : ${points}</p>`;let a=document.querySelector('#raceAnswer');a.focus();a.onkeydown=e=>{if(e.key==='Enter')raceCheck()}}
function raceCheck(){let el=document.querySelector('#raceAnswer');if(!el.value.trim())return;let o=course[idx],ok=Math.abs(num(el.value)-total(o))<.00001;if(ok)points++;idx++;if(idx===course.length){finish();return}raceRender();document.querySelector('#raceFeedback').innerHTML=ok?'<span class="ok">✓ Correct !</span>':'<span class="no">Continue, tu peux te rattraper !</span>'}
function finish(){clearInterval(timer);let elapsed=Math.min(120,Math.floor((Date.now()-start)/1000));app.innerHTML=`<h2 class="title">🏆 Course terminée !</h2><p class="score">Score : ${points} / ${course.length}</p><p class="timer">Temps : ${Math.floor(elapsed/60)} min ${elapsed%60} s</p><p class="welcome">${points>=7?'Excellent ! Les calculs décimaux sont bien maîtrisés.':points>=5?'Bon travail ! Quelques calculs sont encore à consolider.':'Continue à t’entraîner avec les six exercices.'}</p><div class="actions"><button class="primary" onclick="startRace()">🔄 Nouvelle course, nouveaux nombres</button><button onclick="go(1)">Revoir les exercices</button><button onclick="remember()">📚 À retenir</button></div>`}
function remember(){clearInterval(timer);app.innerHTML=`<h2 class="title">📚 À retenir</h2><div class="grid"><div class="task"><h3>Additionner des décimaux</h3><p>On additionne les unités avec les unités, les dixièmes avec les dixièmes, les centièmes avec les centièmes.</p></div><div class="task"><h3>Décomposer</h3><p>1,6 + 2,3 = 1 + 2 + 0,6 + 0,3 = 3,9.</p></div><div class="task"><h3>Poser une opération</h3><p>On écrit les nombres en alignant les virgules et les chiffres de même rang. On peut ajouter des zéros à droite de la partie décimale.</p></div><div class="task"><h3>Soustraire</h3><p>On respecte les rangs des chiffres et on vérifie que la différence est cohérente.</p></div></div><div class="actions"><button class="primary" onclick="go(1)">Recommencer les entraînements</button><button onclick="go(7)">Course aux nombres</button></div>`}
navDraw();home();
</script></body></html>
